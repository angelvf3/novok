[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novok"
version = "0.1.0"
description = "NOVOK: predicción de niebla y techo de nubes con IA para el Aeropuerto de Asturias (LEAS)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ángel Villabrille Fernández" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "matplotlib>=3.8",
    "truststore>=0.9",
    "lightgbm>=4.3",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402"]
