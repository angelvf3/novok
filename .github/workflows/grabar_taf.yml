name: Grabar TAF de LEAS

# Guarda el TAF vigente cada 30 min en la rama "datos-vivo" (no en main, para no chocar con tus commits).
# Para traerlos a tu copia local:
#   git fetch origin datos-vivo
#   git checkout origin/datos-vivo -- data/vivo
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grabar-taf
  cancel-in-progress: false

jobs:
  grabar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install -e .
      - name: Preparar la rama datos-vivo
        run: |
          git config user.name "novok-bot"
          git config user.email "novok-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin datos-vivo > /dev/null; then
            git fetch origin datos-vivo
            git worktree add datos origin/datos-vivo
            git -C datos checkout -B datos-vivo
          else
            git worktree add -b datos-vivo datos HEAD
          fi
      - name: Grabar TAF
        run: python -m novok.data.grabar_taf_vivo --dir datos/data/vivo
      - name: Guardar si hay TAF nuevos
        working-directory: datos
        run: |
          if [ -n "$(git status --porcelain data/vivo)" ]; then
            git add data/vivo
            git commit -m "TAF LEAS $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin datos-vivo
          else
            echo "Sin TAF nuevos"
          fi
